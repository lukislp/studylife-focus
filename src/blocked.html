<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Focus session active - StudyLife FocusGuard</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="card">
    <div class="brand" style="justify-content:center">
      <img class="brand-icon" src="icon48.png" alt="" />
      <span class="brand-name">StudyLife FocusGuard</span>
    </div>
    <h1>You're in a focus session</h1>
    <p class="countdown" id="countdown">…</p>
    <p class="hint" id="until-hint"></p>
    <p class="note">
      This site isn't on your focus allowlist right now. If you need to stop early, end the
      session from StudyLife itself - FocusGuard only ever reads whether a session is running,
      it can't stop one for you.
    </p>
    <a id="open-studylife" class="btn-primary" href="#" hidden>Open StudyLife</a>
  </main>
</body>
</html>
